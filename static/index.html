<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Measure</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e8eaf0; --mut:#8b93a5; --acc:#2dd4bf; --warn:#fbbf24; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:12px 16px 32px; }
  h1 { font-size:18px; margin:8px 0 12px; }
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden; }
  video, canvas { width:100%; display:block; }
  canvas { touch-action:manipulation; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  button, select, input { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  button.primary { background:var(--acc); color:#04201c; border-color:var(--acc); font-weight:600; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut); flex:1; min-width:120px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .out { font-variant-numeric:tabular-nums; }
  .warn { color:var(--warn); } .err { color:var(--err); } .mut { color:var(--mut); font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Spatial Measure</h1>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="hidden"></canvas>
  </div>

  <div class="row">
    <button id="btnCapture" class="primary">Capture</button>
    <button id="btnLive" class="hidden">Back to live</button>
    <button id="btnUndo">Undo point</button>
    <button id="btnClear">Clear</button>
  </div>

  <div class="card">
    <div class="row" style="margin:0">
      <label>Mode
        <select id="mode">
          <option value="length">Length (2 taps)</option>
          <option value="area">Area (3+ taps)</option>
        </select>
      </label>
      <label>Marker size (mm)
        <input id="markerMm" type="number" inputmode="decimal" value="50" step="0.1">
      </label>
      <label>Dictionary
        <select id="dict">
          <option value="4x4_50">ArUco 4x4_50</option>
          <option value="5x5_100">ArUco 5x5_100</option>
          <option value="6x6_250">ArUco 6x6_250</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-bottom:0">
      <button id="btnMeasure" class="primary">Measure</button>
    </div>
    <div id="measureOut" class="out mut" style="margin-top:8px">
      Put the printed marker flat on the same surface as what you measure. Capture, tap the points, press Measure.
    </div>
  </div>

  <div class="card">
    <strong>Volume and weight</strong>
    <div class="row">
      <label>Shape
        <select id="shape">
          <option value="box">Box (L x W x H)</option>
          <option value="prism">Footprint area x height</option>
          <option value="cylinder">Cylinder (diameter, height)</option>
          <option value="sphere">Sphere (diameter)</option>
          <option value="cone">Cone (diameter, height)</option>
        </select>
      </label>
      <label>Material <select id="material"></select></label>
    </div>
    <div class="row" id="dims"></div>
    <div class="row">
      <label>Fill factor (0-1)
        <input id="fill" type="number" step="0.05" min="0" max="1" value="1">
      </label>
      <button id="btnVol" class="primary" style="align-self:flex-end">Estimate</button>
    </div>
    <div class="mut">Tip: the last Length / Area result auto-fills the dimension fields. Height comes from a second photo of the side with the marker on that face.</div>
    <div id="volOut" class="out" style="margin-top:8px"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');
let frozenBlob = null, points = [], last = {};

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    $('measureOut').innerHTML = '<span class="err">Camera unavailable: ' + e.message + ' (HTTPS required).</span>';
  }
}

function capture() {
  if (!video.videoWidth) return;
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  canvas.toBlob(b => { frozenBlob = b; }, 'image/jpeg', 0.92);
  video.classList.add('hidden'); canvas.classList.remove('hidden');
  $('btnCapture').classList.add('hidden'); $('btnLive').classList.remove('hidden');
  points = []; redraw();
}
function live() {
  frozenBlob = null; points = [];
  canvas.classList.add('hidden'); video.classList.remove('hidden');
  $('btnLive').classList.add('hidden'); $('btnCapture').classList.remove('hidden');
}

let overlay = null;
function redraw() {
  if (!frozenBlob && !video.videoWidth) return;
  // Re-draw the frozen frame from the stored blob image
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    const k = canvas.width / 800;
    if (overlay) {
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3 * k;
      ctx.beginPath(); overlay.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.closePath(); ctx.stroke();
    }
    ctx.strokeStyle = '#2dd4bf'; ctx.fillStyle = '#2dd4bf'; ctx.lineWidth = 3 * k;
    ctx.beginPath(); points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    if ($('mode').value === 'area' && points.length > 2) ctx.closePath();
    ctx.stroke();
    points.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 7 * k, 0, 7); ctx.fill(); });
  };
  if (frozenBlob) img.src = URL.createObjectURL(frozenBlob);
}

canvas.addEventListener('click', e => {
  if (!frozenBlob) return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * canvas.width / r.width;
  const y = (e.clientY - r.top) * canvas.height / r.height;
  if ($('mode').value === 'length' && points.length >= 2) points = [];
  points.push([x, y]); redraw();
});
$('btnUndo').onclick = () => { points.pop(); redraw(); };
$('btnClear').onclick = () => { points = []; overlay = null; redraw(); };
$('btnCapture').onclick = capture;
$('btnLive').onclick = live;

$('btnMeasure').onclick = async () => {
  if (!frozenBlob) { $('measureOut').innerHTML = '<span class="warn">Capture a frame first.</span>'; return; }
  const fd = new FormData();
  fd.append('frame', frozenBlob, 'frame.jpg');
  fd.append('payload', JSON.stringify({ mode: $('mode').value, points,
    marker_size_mm: parseFloat($('markerMm').value), dict: $('dict').value }));
  $('measureOut').textContent = 'Computing...';
  const r = await fetch('/api/measure', { method: 'POST', body: fd });
  const d = await r.json();
  if (!d.ok) { $('measureOut').innerHTML = '<span class="err">' + d.error + '</span>'; return; }
  overlay = d.marker_corners_px; redraw();
  let h = '';
  if (d.length_mm !== undefined) {
    h = `<strong>${d.length_mm.toFixed(1)} mm</strong> &plusmn; ${d.U_mm_k2.toFixed(1)} mm (k=2)`;
    last.length = d.length_mm; fillDims('length_mm', d.length_mm);
  } else {
    h = `<strong>${(d.area_mm2/100).toFixed(1)} cm&sup2;</strong> &plusmn; ${(d.U_rel_k2*100).toFixed(1)} % (k=2)<br>perimeter ${d.perimeter_mm.toFixed(1)} mm`;
    last.area = d.area_mm2; fillDims('base_area_mm2', d.area_mm2);
  }
  h += `<div class="mut">scale ${d.mm_per_px.toFixed(3)} mm/px, tilt ratio ${d.tilt_ratio.toFixed(2)}</div>`;
  d.warnings.forEach(w => h += `<div class="warn">${w}</div>`);
  $('measureOut').innerHTML = h;
};

// ---- volume UI ----
const FIELDS = {
  box: ['length_mm', 'width_mm', 'height_mm'],
  prism: ['base_area_mm2', 'height_mm'],
  cylinder: ['diameter_mm', 'height_mm'],
  sphere: ['diameter_mm'],
  cone: ['diameter_mm', 'height_mm'],
};
function renderDims() {
  $('dims').innerHTML = FIELDS[$('shape').value].map(f =>
    `<label>${f}<input data-f="${f}" type="number" inputmode="decimal" step="any"></label>`).join('');
}
function fillDims(field, v) {
  const el = document.querySelector(`[data-f="${field}"]`) ||
    [...document.querySelectorAll('[data-f]')].find(i => !i.value && i.dataset.f.endsWith('_mm') && field === 'length_mm');
  if (el && !el.value) el.value = v.toFixed(1);
}
$('shape').onchange = renderDims;

$('btnVol').onclick = async () => {
  const dims = {};
  document.querySelectorAll('[data-f]').forEach(i => dims[i.dataset.f] = parseFloat(i.value));
  const body = { shape: $('shape').value, dims_mm: dims, material: $('material').value,
                 fill_factor: parseFloat($('fill').value) };
  const r = await fetch('/api/estimate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!d.ok) { $('volOut').innerHTML = '<span class="err">' + d.error + '</span>'; return; }
  $('volOut').innerHTML =
    `Volume <strong>${d.volume_l.toFixed(2)} L</strong> (${d.volume_m3.toExponential(3)} m&sup3;) &plusmn; ${(d.U_rel_volume_k2*100).toFixed(0)} %<br>` +
    `Mass <strong>${d.mass.nominal_kg.toFixed(2)} kg</strong> (range ${d.mass.low_kg.toFixed(2)}-${d.mass.high_kg.toFixed(2)}) &plusmn; ${(d.U_rel_mass_k2*100).toFixed(0)} %<br>` +
    `<div class="mut">${d.note}</div>`;
};

(async () => {
  const m = await (await fetch('/api/materials')).json();
  $('material').innerHTML = Object.keys(m).map(k => `<option>${k}</option>`).join('');
  renderDims(); initCamera();
})();
</script>
</body>
</html>
